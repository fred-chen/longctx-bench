<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LongCtx Console · 长上下文召回/检索/行为退化测试台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--fg:#c9d1d9;--dim:#8b949e;
--acc:#58a6ff;--ok:#3fb950;--bad:#f85149;--warn:#d29922;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:12px}
header h1{font-size:17px;margin:0}
header .sub{color:var(--dim);font-size:12px}
main{display:grid;grid-template-columns:340px 1fr;gap:14px;padding:14px;max-width:1500px;margin:0 auto}
@media(max-width:980px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px}
.panel h2{font-size:13px;margin:0 0 10px;color:var(--acc);text-transform:uppercase;letter-spacing:.05em}
label{display:block;color:var(--dim);font-size:12px;margin:8px 0 3px}
input[type=text],input[type=password],input[type=number],select,textarea{
width:100%;background:#0d1117;color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:13px}
textarea{resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1}
.checks label{display:flex;align-items:center;gap:7px;color:var(--fg);margin:6px 0;font-size:13px;cursor:pointer}
.checks input{width:auto}
button{background:#21262d;color:var(--fg);border:1px solid var(--border);border-radius:6px;
padding:8px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--acc)}
button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
button.danger{color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#status{font-size:12px;color:var(--dim);margin-top:8px;word-break:break-all}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border:1px solid var(--border);padding:5px 8px;text-align:left}
th{background:#1c2129;color:var(--dim);font-weight:600}
td.pass{color:var(--ok);font-weight:700}td.fail{color:var(--bad);font-weight:700}
td.warn{color:var(--warn);font-weight:700}
.hm td{width:64px;height:34px;text-align:center;font-weight:700;font-size:12px}
.hm .p{background:#12461c;color:#7ee787}.hm .f{background:#5a1e1e;color:#ffa198}.hm .n{color:#30363d}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;margin-right:4px}
.badge.loop{background:#5a1e1e;color:#ffa198}.badge.caveman{background:#4d3800;color:#e3b341}
.badge.rep{background:#3d2b52;color:#d2a8ff}.badge.thinking{background:#0c3b5e;color:#79c0ff}
#log{background:#0a0e14;border:1px solid var(--border);border-radius:6px;padding:10px;
height:220px;overflow:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
#log .ok{color:var(--ok)}#log .bad{color:var(--bad)}#log .dim{color:var(--dim)}
details{margin-top:8px}summary{cursor:pointer;color:var(--dim);font-size:12px}
pre.ans{background:#0a0e14;border:1px solid var(--border);border-radius:6px;padding:8px;
font-size:12px;white-space:pre-wrap;max-height:300px;overflow:auto;margin:6px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1200px){.grid2{grid-template-columns:1fr}}
.hint{font-size:11.5px;color:var(--dim);margin-top:6px}
a{color:var(--acc)}
#running-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--warn);margin-right:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.metric{font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>🧵 LongCtx Console · Standalone</h1>
  <span class="sub">长上下文 召回/检索/多跳/计数/退化测试 · 单文件版，直连推理端点（需 CORS）</span>
</header>
<main>
<!-- ============================== LEFT: config ============================== -->
<div>
  <div class="panel">
    <h2>1. Endpoint</h2>
    <label>Base URL (OpenAI 兼容，含 /v1)</label>
    <input type="text" id="base" value="http://ai395:8080/v1">
    <div class="row">
      <div><label>Model ID</label><input type="text" id="model" value="Qwen3.8-Flash-Next"></div>
      <div style="flex:0 0 auto;align-self:flex-end"><label>&nbsp;</label><button id="btn-models" title="GET /models">拉取模型</button></div>
    </div>
    <div id="model-list"></div>
    <label>API Key (可选)</label>
    <input type="password" id="apikey" placeholder="sk-...">
    <div class="row" style="margin-top:8px">
      <div><label>max_tokens 短答</label><input type="number" id="mt-short" value="768"></div>
      <div><label>max_tokens 长文</label><input type="number" id="mt-long" value="2600"></div>
    </div>
    <div class="checks">
      <label>思考模式 (enable_thinking)</label>
      <select id="opt-thinkmode"><option value="off" selected>关闭（默认，避免思考吃光 max_tokens）</option><option value="on">开启</option><option value="default">不干预（不发该参数，适用于不支持的模型）</option></select>
      <label><input type="checkbox" id="opt-stream" checked> 流式 (测 TTFT / tok/s)</label>
    </div>
    <div class="metric">token 校准系数 chars/token: <b id="cpc">—（首次运行自动校准）</b></div>
  </div>

  <div class="panel">
    <h2>2. Haystack 语料</h2>
    <select id="corpus-src">
      <option value="file" selected>选择本地 txt 文件（推荐：corpus_all.txt 或多本书）</option>
      <option value="tiny">内置小语料（~40KB，冒烟测试用）</option>
      <option value="paste">粘贴自定义文本</option>
    </select>
    <div id="corpus-file-box" style="display:none">
      <label>支持多选 .txt，合计上限 20MB</label>
      <input type="file" id="corpus-file" accept=".txt,text/plain" multiple>
    </div>
    <div id="corpus-paste-box" style="display:none">
      <textarea id="corpus-paste" rows="5" placeholder="粘贴任意长文本…"></textarea>
    </div>
    <div class="btns"><button id="btn-load">加载语料</button><span id="corpus-info" class="metric"></span></div>
  </div>

  <div class="panel">
    <h2>3. 测试项</h2>
    <label>上下文长度 (tokens，逗号分隔，目标值)</label>
    <input type="text" id="lengths" value="131072,262144,327680">
    <label>NIAH 深度 % (needle 位置)</label>
    <input type="text" id="depths" value="0,25,50,75,100">
    <div class="checks">
      <label><input type="checkbox" id="t1" checked> T1 单针 NIAH 网格（召回热图）</label>
      <label><input type="checkbox" id="t2" checked> T2 五针多路召回（检索）</label>
      <label><input type="checkbox" id="t3" checked> T3 三跳事实链（推理）</label>
      <label><input type="checkbox" id="t4" checked> T4 计数聚合 ×7</label>
      <label><input type="checkbox" id="t5" checked> T5 强制长文生成（退化探针）</label>
    </div>
    <div class="btns">
      <button id="btn-run" class="primary">▶ 开始测试</button>
      <button id="btn-stop" class="danger" disabled>■ 停止</button>
      <button id="btn-export">导出 JSON</button>
    </div>
    <div id="status">待命</div>
  </div>
</div>

<!-- ============================== RIGHT: results ============================== -->
<div>
  <div class="panel">
    <h2>结果总览</h2>
    <div id="summary"><span class="metric">尚未运行。提示：先用小长度（如 8192）+ T5 冒烟一遍。</span></div>
    <div id="degen-panel"></div>
  </div>
  <div class="grid2">
    <div class="panel"><h2>召回热图 (T1 长度×深度)</h2><div id="heatmap"><span class="metric">—</span></div></div>
    <div class="panel"><h2>结果明细</h2><div id="results" style="max-height:480px;overflow:auto"><span class="metric">—</span></div></div>
  </div>
  <div class="panel">
    <h2>实时日志 <span id="dot"></span></h2>
    <div id="log"></div>
  </div>
</div>
</main>

<script>
"use strict";
/* ================= state ================= */
const $=id=>document.getElementById(id);
const S={corpus:null,cpc:null,queue:[],running:false,stop:false,results:[],lastDelta:0};
const now=()=>new Date().toLocaleTimeString();
function log(msg,cls){const d=$("log");d.innerHTML+=`<span class="dim">[${now()}]</span> <span class="${cls||''}">${esc(msg)}</span>\n`;d.scrollTop=d.scrollHeight;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function rndHex(n){let s="";
  if(self.crypto&&crypto.getRandomValues){const a=new Uint8Array(Math.ceil(n/2));crypto.getRandomValues(a);s=[...a].map(b=>b.toString(16).padStart(2,"0")).join("");}
  while(s.length<n)s+=Math.random().toString(16).slice(2);
  return s.slice(0,n);} // crypto.randomUUID 在 http 明文页不可用，改用 getRandomValues 兼容
function uuid8(){return rndHex(8).toUpperCase();}
function hex4(){return rndHex(4);}

/* ================= degeneration metrics (mirror bench.py) ================= */
const FUNC=new Set(("a an the and or but if then than that this these those of in on at to for from by with "+
"without within into onto about above below under over between during while as is are was were be been being am "+
"do does did done have has had having will would shall should can could may might must not no nor so yet both "+
"either each every all any some few more most other another such own same it its he she they him her them his "+
"hers theirs our your my me we us you i who whom which what when where how why all's there here too very just "+
"also once upon per via one two three").split(/\s+/));
function analyzeText(text){
  const words=(text.toLowerCase().match(/[a-z'’]+/g))||[];
  const n=words.length, out={words:n,distinct2:null,max10gram_repeat:0,
    function_word_ratio:null,avg_words_per_sentence:null,loop:false,caveman:false,repetitive:false};
  if(n<5)return out;
  const big=new Set();for(let i=0;i+1<n;i++)big.add(words[i]+" "+words[i+1]);
  out.distinct2=+(big.size/Math.max(1,n-1)).toFixed(3);
  const c=new Map();let mx=0;
  for(let i=0;i+10<=n;i++){const g=words.slice(i,i+10).join(" ");const v=(c.get(g)||0)+1;c.set(g,v);if(v>mx)mx=v;}
  out.max10gram_repeat=mx;
  out.function_word_ratio=+(words.filter(w=>FUNC.has(w)).length/n).toFixed(3);
  const sents=text.split(/[.!?\n]+/).filter(s=>s.trim()).length||1;
  out.avg_words_per_sentence=+(n/sents).toFixed(1);
  out.loop=out.max10gram_repeat>=3;
  out.repetitive=out.distinct2<0.60&&n>150;
  out.caveman=n>80&&out.function_word_ratio<0.30&&out.avg_words_per_sentence<10;
  return out;
}

/* ================= api via /proxy ================= */
async function chat({maxTokens,onDelta}){
  const base=$("base").value.trim(),payload={
    model:$("model").value.trim(),
    messages:[],temperature:0,max_tokens:maxTokens,
    stream:$("opt-stream").checked,
  };
  if(payload.stream)payload.stream_options={include_usage:true};
  const tm=$("opt-thinkmode").value;
  if(tm!=="default")payload.chat_template_kwargs={enable_thinking:tm==="on"};
  return {base,payload};
}
async function callApi(messages,maxTokens,onDelta){
  const {base,payload}=await chat({maxTokens});
  payload.messages=messages;
  const t0=performance.now();let ttft=null,content="",reasoning="",usage=null,finish=null;
  let resp;
  const hdrs={"Content-Type":"application/json"};
  const ak=$("apikey").value.trim();if(ak)hdrs["Authorization"]="Bearer "+ak;
  try{
    resp=await fetch(base.replace(/\/$/,"")+"/chat/completions",{method:"POST",headers:hdrs,
      body:JSON.stringify(payload),mode:"cors"});
  }catch(e){
    return{error:`请求发送失败: ${e.message}（若为 CORS/网络错误：给服务端加 CORS 头，如 vLLM 加 --allow-origins '*'，llama.cpp 加 --origins '*'；或确认端点可达/页面用https时端点也是https）`,content:"",reasoning:"",elapsed:(performance.now()-t0)/1000,usage:null,finish:null,ttft:null};
  }
  const ctype=resp.headers.get("content-type")||"";
  if(!resp.ok){const t=await resp.text();return{error:`HTTP ${resp.status}: ${t.slice(0,300)}`,content:"",reasoning:"",elapsed:(performance.now()-t0)/1000,usage,finish,ttft};}
  if(payload.stream){
    const reader=resp.body.getReader(),dec=new TextDecoder();let buf="",doneFlag=false;
    for(;;){
      const {done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      let nl;
      while((nl=buf.indexOf("\n"))>=0){
        const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);
        if(!line.startsWith("data:")){
          if(line.startsWith("{")&&line.includes('"error"')){try{return{error:JSON.parse(line).error,content,reasoning,elapsed:(performance.now()-t0)/1000,usage,finish,ttft};}catch(e){}}
          continue;}
        const data=line.slice(5).trim();if(data==="[DONE]"){doneFlag=true;break;}
        let d;try{d=JSON.parse(data);}catch(e){continue;}
        if(d.usage)usage=d.usage;
        for(const ch of (d.choices||[])){
          if(ch.finish_reason)finish=ch.finish_reason;
          const dl=ch.delta||{};
          if(dl.content){if(ttft===null)ttft=performance.now()-t0;content+=dl.content;if(onDelta)onDelta("c",dl.content);}
          if(dl.reasoning_content){if(ttft===null)ttft=performance.now()-t0;reasoning+=dl.reasoning_content;if(onDelta)onDelta("r",dl.reasoning_content);}
        }
      }
      if(S.stop||doneFlag){try{reader.cancel()}catch(e){}break;}
    }
  }else{
    const d=await resp.json();
    if(d.error)return{error:JSON.stringify(d.error).slice(0,300),content:"",reasoning:"",elapsed:(performance.now()-t0)/1000,usage:null,finish:null,ttft:null};
    const ch=(d.choices||[{}])[0];usage=d.usage||null;finish=ch.finish_reason||null;
    content=(ch.message&&ch.message.content)||"";reasoning=(ch.message&&ch.message.reasoning_content)||"";
  }
  return {error:null,content,reasoning,usage,finish,ttft,elapsed:(performance.now()-t0)/1000};
}

async function loadCorpus(){
  const src=$("corpus-src").value;let text="";
  try{
    if(src==="file"){
      const files=[...($("corpus-file").files||[])];
      if(!files.length){log("请先选择 .txt 文件","bad");return;}
      let total=0;const bufs=[];
      for(const f of files){const t=await f.text();bufs.push(t);total+=t.length;
        if(total>20*1024*1024){log("语料超过 20MB 上限，已截断","bad");break;}}
      text=bufs.join("\n\n");
    }
    else if(src==="tiny"){text=TINY_CORPUS;}
    else text=$("corpus-paste").value;
  }catch(e){log("语料加载失败: "+e,"bad");return;}
  if(!text||text.length<1000){log("语料过短(<1KB)，无法构造测试","bad");return;}
  S.corpus=text.replace(/\s+/g," ");
  $("corpus-info").textContent=`${(S.corpus.length/1024/1024).toFixed(2)} M chars ≈ ${Math.round(S.corpus.length/(S.cpc||3.8)/1024)}K tokens`;
  log(`语料就绪: ${(S.corpus.length/1024).toFixed(0)}K chars`,"ok");
}
async function calibrate(){
  if(!S.corpus)await loadCorpus();if(!S.corpus)return null;
  const sample=S.corpus.slice(0,20000);
  const r=await callApi([{role:"user",content:sample+"\n\nReply OK."}],16,null);
  const pt=r.usage&&r.usage.prompt_tokens;
  if(pt){S.cpc=sample.length/pt;$("cpc").textContent=S.cpc.toFixed(3)+`（${sample.length} chars → ${pt} tokens）`;
    log(`校准: chars/token=${S.cpc.toFixed(3)}`,"ok");return S.cpc;}
  S.cpc=3.8;$("cpc").textContent="3.800（估算——服务端未返回 usage）";
  log("警告: 无 usage，token 数按 3.8 chars/token 估算","bad");return S.cpc;
}

function buildContext(chars,inserts){
  const base=S.corpus.slice(0,Math.min(chars,S.corpus.length));
  const marks=inserts.map(([depth,text])=>{
    let pos=Math.floor(base.length*depth/100);
    let cut=base.lastIndexOf(". ",Math.min(base.length-1,pos+2000));
    if(cut<Math.max(0,pos-4000))cut=base.indexOf(". ",Math.max(0,pos-2000));
    if(cut<0)cut=pos;
    return[Math.min(cut+2,base.length),text];
  }).sort((a,b)=>a[0]-b[0]);
  let out="",prev=0;
  for(const[pos,text]of marks){out+=base.slice(prev,pos)+`\n\n>>> ${text} <<<\n\n`;prev=pos;}
  return out+base.slice(prev);
}

      q:"You are a security auditor. First list each Project mentioned in the document with its launch code. Then, continuing in the same response, write a detailed analytical essay of at least 350 words on how long documents should be audited for leaked secrets, covering detection methods, prioritisation, reporting and remediation. Do not stop early.",
      max:+$("mt-long").value,check:a=>{const u=a.toUpperCase();const g=codes.filter(c=>u.includes(c)).length;
        return{ok:g>=2,note:`codes ${g}/3 in essay`};},expect:codes.join(", ")};},
};

/* ================= runner ================= */
async function runOne(task,length,depth){
  const T=TASKS[task](length,depth??-1);
  const maxTok=task==="T5"?T.max:(task==="T1"?+ $("mt-short").value:T.max);
  status(`运行 ${task} @ ${fmtK(length)}t depth=${depth}% …`);
  const msgs=[{role:"user",content:T.ctx+QBOX(T.q)}];
  const r=await callApi(msgs,maxTok,streamDelta());
  const ans=(r.content||r.reasoning||"");
  let chk=T.check(ans);if(chk===true||chk===false)chk={ok:chk,note:""};
  const res={task,target_tokens:length,depth:depth??-1,ok:!!chk.ok,note:chk.note||"",
    expect:String(T.expect),answer:(r.content||"").slice(0,1200),error:r.error,
    elapsed:+r.elapsed.toFixed(1),ttft:r.ttft?+(r.ttft/1000).toFixed(2):null,
    prompt_tokens:r.usage?r.usage.prompt_tokens:null,
    completion_tokens:r.usage?r.usage.completion_tokens:null,finish:r.finish,
    metrics:analyzeText(r.content||"")};
  S.results.push(res);render();
  const deg=["loop","caveman","repetitive"].filter(k=>res.metrics[k]);
  log(`${task} @${fmtK(length)}t d${depth}: ${res.ok?"PASS":"FAIL"} ${res.elapsed}s `+
      `pt=${res.prompt_tokens??"?"} ${deg.length?"⚠"+deg.join("/")+"" :""} ${res.note}${r.error?" | "+r.error:""}`,
      r.error?"bad":(res.ok?"ok":"bad"));
  // auto-recalibrate if context undershot target
  if(res.prompt_tokens&&res.prompt_tokens<0.985*length&&!S.stop){
    S.cpc=S.cpc*(length/res.prompt_tokens)*1.01;
    $("cpc").textContent=S.cpc.toFixed(3)+"（已在线修正）";
    log(`${task}@${fmtK(length)} 实际 ${res.prompt_tokens}t < 目标，修正 cpc=${S.cpc.toFixed(2)} 重试一次`);
    S.results.pop();return runOne(task,length,depth);
  }
  return res;
}
function streamDelta(){
  if(!$("opt-stream").checked)return null;
  let acc="";
  return(kind,ch)=>{acc+=ch;const t=performance.now();
    if(t-S.lastDelta>400){S.lastDelta=t;status(`${kind==="r"?"🧠思考":"✍️输出"} ${acc.length} chars …`);}};
}
async function runAll(){
  if(S.running)return;
  if(!S.corpus){await loadCorpus();if(!S.corpus)return;}
  if(!S.cpc)await calibrate();
  if(!S.cpc)return;
  const lengths=$("lengths").value.split(",").map(x=>parseInt(x.trim())).filter(x=>x>0);
  const depths=$("depths").value.split(",").map(x=>parseInt(x.trim())).filter(x=>!isNaN(x));
  for(const L of lengths)if(L*S.cpc>S.corpus.length){
    log(`语料不够 ${fmtK(L)} tokens（上限约 ${fmtK(Math.floor(S.corpus.length/S.cpc))}t），将截断`,"bad");break;}
  const jobs=[];
  for(const L of lengths){
    if($("t1").checked)for(const d of depths)jobs.push(["T1",L,d]);
    if($("t2").checked)jobs.push(["T2",L,-1]);
    if($("t3").checked)jobs.push(["T3",L,-1]);
    if($("t4").checked)jobs.push(["T4",L,-1]);
    if($("t5").checked)jobs.push(["T5",L,-1]);
  }
  if(!jobs.length)return log("未勾选任何测试项","bad");
  S.running=true;S.stop=false;S.results=[];render();
  $("btn-run").disabled=true;$("btn-stop").disabled=false;$("dot").innerHTML='<span id="running-dot"></span>';
  log(`开始 ${jobs.length} 个用例（长度×${lengths.join("/")}）`,"ok");
  for(const[task,L,d]of jobs){
    if(S.stop){log("已停止","bad");break;}
    try{await runOne(task,L,d);}catch(e){log(`${task}@${L} 异常: ${e}`,"bad");}
  }
  S.running=false;$("btn-run").disabled=false;$("btn-stop").disabled=true;$("dot").innerHTML="";
  status("完成");render();log("全部完成，可导出 JSON","ok");
}

/* ================= rendering ================= */
function fmtK(n){return n>=1024?(n/1024).toFixed(0)+"K":n;}
function status(t){$("status").textContent=t;}
function render(){
  const R=S.results;
  /* summary */
  const byL={};R.forEach(r=>{(byL[r.target_tokens]=byL[r.target_tokens]||[]).push(r);});
  let h="<table><tr><th>目标长度</th><th>实际pt</th><th>T1 召回</th><th>其他任务</th><th>退化标志</th><th>均速 tok/s</th></tr>";
  for(const L of Object.keys(byL).sort((a,b)=>a-b)){
    const ts=byL[L],t1=ts.filter(t=>t.task==="T1"),ot=ts.filter(t=>t.task!=="T1");
    const deg=[...new Set(ts.flatMap(t=>["loop","caveman","repetitive"].filter(k=>t.metrics[k])))];
    const tps=ts.filter(t=>t.completion_tokens&&t.elapsed).map(t=>Math.round(t.completion_tokens/t.elapsed));
    h+=`<tr><td>${fmtK(+L)}</td><td>${Math.max(...ts.map(t=>t.prompt_tokens||0)).toLocaleString()||"?"}</td>`+
       `<td class="${t1.every(t=>t.ok)?"pass":(t1.some(t=>t.ok)?"warn":"fail")}">${t1.filter(t=>t.ok).length}/${t1.length||"-"}</td>`+
       `<td class="${ot.every(t=>t.ok)?"pass":(ot.some(t=>t.ok)?"warn":"fail")}">${ot.filter(t=>t.ok).length}/${ot.length||"-"}</td>`+
       `<td class="${deg.length?"fail":"pass"}">${deg.join(",")||"无"}</td>`+
       `<td>${tps.length?Math.round(tps.reduce((a,b)=>a+b,0)/tps.length):"?"}</td></tr>`;}
  h+="</table>";
  if(R.length)$("summary").innerHTML=h;
  /* degeneration */
  const bad=R.filter(t=>t.metrics.loop||t.metrics.caveman||t.metrics.repetitive);
  $("degen-panel").innerHTML=bad.length?
    `<div style="margin-top:10px"><b style="color:var(--bad)">⚠ ${bad.length} 个响应出现退化标志：</b>`+
    bad.map(t=>`<div class="metric">${t.task}@${fmtK(t.target_tokens)}: `+
      (t.metrics.loop?'<span class="badge loop">LOOP ×'+t.metrics.max10gram_repeat+'</span>':"")+
      (t.metrics.caveman?'<span class="badge caveman">CAVEMAN fw='+t.metrics.function_word_ratio+'</span>':"")+
      (t.metrics.repetitive?'<span class="badge rep">REP d2='+t.metrics.distinct2+'</span>':"")+`</div>`).join("")+`</div>`:"";
  /* heatmap */
  const lengths=[...new Set(R.map(r=>r.target_tokens))].sort((a,b)=>a-b);
  const ds=[...new Set(R.filter(r=>r.task==="T1").map(r=>r.depth))].sort((a,b)=>a-b);
  if(lengths.length&&ds.length){
    let m='<table class="hm"><tr><th>长度\\深度</th>'+ds.map(d=>`<th>${d}%</th>`).join("")+"</tr>";
    for(const L of lengths){m+=`<tr><td>${fmtK(L)}t</td>`;
      for(const d of ds){const t=R.find(r=>r.task==="T1"&&r.target_tokens===L&&r.depth===d);
        m+=t?`<td class="${t.ok?"p":"f"}" title="${esc(t.answer.slice(0,80))}">${t.ok?"✓":"✗"}</td>`:'<td class="n">·</td>';}
      m+="</tr>";}
    $("heatmap").innerHTML=m+"</table>";}
  /* detail table */
  if(R.length){
    let d='<table><tr><th>任务</th><th>长度</th><th>深</th><th>结果</th><th>pt</th><th>ttft</th><th>耗时</th><th>tok/s</th><th>指标</th><th>备注</th></tr>';
    for(const t of R){
      const tps=t.completion_tokens&&t.elapsed?Math.round(t.completion_tokens/t.elapsed):"?";
      const bad=["loop","caveman","repetitive"].some(k=>t.metrics[k]);
      d+=`<tr><td>${t.task}</td><td>${fmtK(t.target_tokens)}</td><td>${t.depth}%</td>`+
         `<td class="${t.error?"fail":(t.ok?"pass":"fail")}">${t.error?"ERR":(t.ok?"PASS":"FAIL")}</td>`+
         `<td>${t.prompt_tokens??""}</td><td>${t.ttft??""}</td><td>${t.elapsed}s</td><td>${tps}</td>`+
         `<td class="${bad?"warn":""}">${t.metrics.words}w fw=${t.metrics.function_word_ratio??"-"} d2=${t.metrics.distinct2??"-"}</td>`+
         `<td>${esc(t.note||t.error||"")}</td></tr>`+
         `<tr><td colspan="10" style="color:var(--dim);font-size:11.5px">预期: ${esc(t.expect)} → 答: ${esc((t.answer||"").slice(0,200))}</td></tr>`;}
    $("results").innerHTML=d+"</table>";}
}
$("btn-export").onclick=()=>{
  const blob=new Blob([JSON.stringify({meta:{base:$("base").value,model:$("model").value,cpc:S.cpc,
    at:new Date().toISOString()},tests:S.results},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="longctx_results.json";a.click();};
$("btn-run").onclick=runAll;
$("btn-stop").onclick=()=>{S.stop=true;log("停止请求已发出（等当前请求结束）…")};
$("btn-load").onclick=loadCorpus;
$("corpus-src").onchange=e=>{$("corpus-file-box").style.display=e.target.value==="file"?"":"none";
  $("corpus-paste-box").style.display=e.target.value==="paste"?"":"none";};
$("btn-models").onclick=async()=>{
  try{
    const r=await fetch($("base").value.replace(/\/$/,"")+"/models",{mode:"cors"});
    const t=await r.text();
    const ms=JSON.parse(t).data.map(m=>m.id);
    $("model-list").innerHTML="<div style='margin-top:8px'>"+ms.map(m=>
      `<button style="margin:2px;font-size:12px" onclick="$('model').value='${esc(m)}'">${esc(m)}</button>`).join("")+"</div>";
    log("发现模型: "+ms.join(", "),"ok");
  }catch(e){log("拉取 /models 失败: "+e+(e.message.includes("fetch")?"（多为 CORS 拦截或地址不可达）":""),"bad");}};
</script>
