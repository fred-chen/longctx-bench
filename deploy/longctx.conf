# longctx-bench console — drop into /etc/nginx/default.d/longctx.conf
# 反代到本机 127.0.0.1:8899 (serve.py)。访问 http://<host>/longctx/
# 需要 SELinux: setsebool -P httpd_can_network_connect 1
location = /longctx { return 301 /longctx/; }
location /longctx/ {
    proxy_pass http://127.0.0.1:8899/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;              # SSE 流式必须
    proxy_cache off;
    proxy_read_timeout 1800s;         # 长上下文单请求可达数分钟
    proxy_send_timeout 1800s;
    client_max_body_size 64m;         # 300K+ token 的 prompt 体积
    auth_basic           "longctx";
    auth_basic_user_file /etc/nginx/.htpasswd_longctx;
}
